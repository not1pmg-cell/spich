<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>StarUm</title><meta name="theme-color" content="#07060b">
<link rel="icon" href="icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--bg:#07060b;--s1:#110f18;--s2:#18151f;--s3:#221d2c;--ln:#ffffff12;--ln2:#ffffff24;--mu:#9a93ad;--tx:#f7f4fc;
--f1:#ff8a1a;--f2:#ff2e63;--f3:#a855f7;--ac:#ff7a18;--ok:#2ee59d;--ton:#38d9ff;--gold:#ffc83d;--red:#ff4d6d;
--fire:linear-gradient(135deg,#ffb11a,#ff6a1a 35%,#ff2e63 70%,#a855f7);--fireh:linear-gradient(90deg,#ffb11a,#ff6a1a,#ff2e63,#a855f7);
--H:Unbounded,Manrope,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}input{font:inherit;color:inherit}
html{background:var(--bg)}
body{min-height:100vh;color:var(--tx);font:600 14px/1.38 Manrope,system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 104px;user-select:none;-webkit-user-select:none;overflow-x:hidden;background:var(--bg)}
input{user-select:text;-webkit-user-select:text}
/* ---------- фоны */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .bl{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
#bgfx .b1{width:380px;height:380px;left:-120px;top:-80px;background:#ff6a1a55;animation-duration:17s}
#bgfx .b2{width:420px;height:420px;right:-160px;top:22%;background:#a855f74d;animation-duration:22s;animation-delay:-6s}
#bgfx .b3{width:360px;height:360px;left:10%;bottom:-160px;background:#ff2e6340;animation-duration:20s;animation-delay:-3s}
@keyframes float{50%{transform:translate(60px,40px) scale(1.15)}100%{transform:translate(-30px,80px) scale(.9)}}
#bgfx .gridf{position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;background-image:linear-gradient(#ff2e6340 1px,transparent 1px),linear-gradient(90deg,#ff2e6340 1px,transparent 1px);background-size:44px 44px;transform:perspective(320px) rotateX(62deg);transform-origin:bottom;animation:gridm 2.4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%);display:none}
@keyframes gridm{to{background-position:0 44px}}
body.bg-grid #bgfx .gridf{display:block}body.bg-grid #bgfx .b2{background:#22d3ee44}
body.bg-cosmos #bgfx .bl{opacity:.3}body.bg-off #bgfx .bl{display:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
header,section,.nav,#notice{position:relative;z-index:2}
h2,.B,.num{font-family:var(--H);font-weight:700}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:22px 2px 11px;display:flex;align-items:center;gap:8px}h2 .r{margin-left:auto;letter-spacing:0;text-transform:none;font:700 12px Manrope,system-ui}
small{color:var(--mu);font-weight:600}
#notice{display:none;margin:0 0 12px;padding:10px 14px;border:1px solid #ff8a1a55;background:linear-gradient(90deg,#ff6a1a22,#a855f714);color:#ffd2a8;border-radius:14px;font-weight:700;font-size:13px;animation:up .4s}
/* ---------- шапка */
.hd{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.me{display:flex;gap:10px;align-items:center;flex:1;min-width:0;text-align:left;padding:4px 10px 4px 4px;border-radius:18px;transition:background .2s}.me:active{background:#ffffff0a}
.ava{--p:0;width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;background:conic-gradient(var(--f1),var(--f2) calc(var(--p)*1%),#ffffff1c 0);position:relative}
.ava::before{content:"";position:absolute;inset:2.5px;border-radius:13px;background:linear-gradient(135deg,#2a1d2e,#120f18)}
.ava b{position:relative;font:800 18px var(--H);background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent}
.ava i{position:absolute;right:-5px;bottom:-5px;background:var(--fire);color:#fff;border-radius:7px;font:800 10px Manrope,system-ui;padding:1px 6px;font-style:normal;box-shadow:0 2px 8px #ff4d3d66}
.hn{min-width:0}.hn b{display:flex;align-items:center;gap:5px;font:800 16px Manrope,system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hn small{font-size:12px;display:flex;align-items:center;gap:5px}
.hn svg{width:14px;height:14px;fill:none;stroke:var(--mu);stroke-width:2.2;stroke-linecap:round}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.35}}
.balp{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#1b1622,#120f18);border:1px solid var(--ln2);border-radius:16px;padding:6px 6px 6px 11px;position:relative;overflow:hidden}
.balp::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff14 50%,transparent 70%);transform:translateX(-100%);animation:shine 4.5s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.balp .v{display:grid;line-height:1.1;text-align:right}.balp .v b{font:800 15px var(--H)}.balp .v small{font-size:10.5px;color:var(--ton)}

.bump{animation:bump .6s}@keyframes bump{30%{transform:scale(1.18)}}
/* ---------- общие */
.card{position:relative;background:linear-gradient(180deg,#15121cdd,#0d0b12dd);border:1px solid var(--ln);border-radius:20px;padding:14px;backdrop-filter:blur(8px);animation:up .45s both;animation-delay:calc(var(--n,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{flex:1;min-width:60px;padding:11px 8px;border-radius:13px;background:var(--s2);border:1px solid var(--ln);font:700 14px var(--H);text-align:center;transition:transform .1s,border-color .15s,background .15s}
.opt:active,.btn:active{transform:scale(.96)}.opt.on{background:linear-gradient(135deg,#ff6a1a2e,#ff2e631f);border-color:var(--f1);color:#fff;box-shadow:0 0 20px #ff6a1a33}
.opt small{display:block;font:600 10px Manrope,system-ui;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:15px;font:700 15px var(--H);background:var(--s2);border:1px solid var(--ln2);margin-top:8px;text-align:center;transition:transform .1s,filter .2s}
.btn.go{background:var(--fire);background-size:200% 200%;color:#fff;border-color:transparent;box-shadow:0 8px 30px #ff4d3d44;animation:gshift 5s ease infinite}@keyframes gshift{50%{background-position:100% 100%}}
.btn.ton{background:linear-gradient(135deg,#38d9ff,#0098ea);color:#00121c;border-color:transparent;box-shadow:0 8px 28px #0098ea44}
.btn:disabled{opacity:.38;box-shadow:none;pointer-events:none}.btn.sm{padding:9px 12px;font-size:13px;width:auto;margin:0}
.ghost{width:100%;padding:12px;color:var(--mu);font-weight:700}
.li{display:flex;align-items:center;gap:11px;padding:12px 13px;background:linear-gradient(180deg,#14111bcc,#0c0a11cc);border:1px solid var(--ln);border-radius:16px;margin-bottom:8px;animation:up .4s both;animation-delay:calc(var(--n,0)*40ms)}
.li .g{flex:1;min-width:0}.li .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:26px;line-height:1.15;margin-top:2px}.note{padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);margin:8px 0;word-break:break-all}
code{color:var(--ton);font-family:ui-monospace,monospace}
.sp{display:inline-block;width:15px;height:15px;border:2.5px solid #fff4;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:#fff;color:#0b0910;padding:11px 18px;border-radius:14px;z-index:95;animation:tin .35s cubic-bezier(.2,1.4,.4,1);max-width:90vw;text-align:center;font-weight:800;box-shadow:0 12px 34px #000b}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--s2);border:1px solid var(--ln);color:var(--mu);font-weight:700;font-size:12.5px;transition:.15s;white-space:nowrap}.chip.on{background:linear-gradient(135deg,#ff6a1a33,#ff2e6322);border-color:#ff8a1a99;color:#fff}
.seg{display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;padding:9px 6px;border-radius:10px;color:var(--mu);font-weight:800;font-size:13px;transition:.2s}.seg button.on{background:var(--s3);color:#fff;box-shadow:0 2px 10px #0006}
.inp{width:100%;background:var(--s2);border:1px solid var(--ln2);border-radius:14px;padding:13px 14px;outline:0;font:700 15px Manrope,system-ui;transition:border-color .2s,box-shadow .2s}.inp:focus{border-color:var(--f1);box-shadow:0 0 0 3px #ff8a1a22}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}.empty i{display:block;font-size:40px;font-style:normal;margin-bottom:8px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.tag{display:inline-block;padding:2px 7px;border-radius:7px;font:800 10px Manrope,system-ui;background:var(--s3);color:var(--mu);letter-spacing:.02em}.tag.f{background:var(--fire);color:#fff}.tag.c{background:#38d9ff1f;color:var(--ton)}.tag.g{background:#2ee59d1f;color:var(--ok)}.tag.v{background:#a855f726;color:#d8b4fe}
section{display:none}section.on{display:block;animation:vin .35s cubic-bezier(.2,.9,.3,1)}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
/* ---------- навигация */
.nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:2px;padding:6px;background:#0d0b12e8;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--ln2);border-radius:22px;z-index:5;box-shadow:0 14px 44px #000d}
.nav button{flex:1;padding:8px 2px 7px;border-radius:16px;color:var(--mu);font:700 10.5px Manrope,system-ui;display:grid;justify-items:center;gap:3px;line-height:1.1;position:relative;transition:color .2s}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.nav .on{color:#fff;background:linear-gradient(180deg,#ff6a1a24,#ff2e6310)}.nav .on svg{transform:translateY(-2px) scale(1.1);stroke:url(#fireg)}
.nav .on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;background:var(--fireh);box-shadow:0 0 14px var(--f1);border-radius:3px}
.nav .dotb{position:absolute;top:5px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--f2);box-shadow:0 0 8px var(--f2)}
/* ---------- шиты */
.ov{position:fixed;inset:0;background:#000b;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:10;display:none;align-items:flex-end}.ov.on{display:flex;animation:fin .25s}@keyframes fin{from{opacity:0}}
.sheet{width:100%;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#18141f,#0b0910);border-radius:26px 26px 0 0;border-top:1px solid var(--ln2);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 20px);animation:sl .35s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#ffffff30;margin:0 auto 12px}
@keyframes sl{from{transform:translateY(100%)}}
.sheet h3{font:800 19px var(--H);display:flex;align-items:center;gap:10px}.lbl{color:var(--mu);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:16px 2px 8px}
.ov.c{align-items:center;justify-content:center;z-index:70}.ov.c .sheet{border-radius:26px;max-width:350px;margin:0 16px;text-align:center;border:1px solid var(--ln2);animation:po .45s cubic-bezier(.2,1.4,.4,1)}.ov.c .sheet::before{display:none}
@keyframes po{0%{transform:scale(.6);opacity:0}}
/* ---------- главная */
.hero{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;text-align:left;background:var(--fire);background-size:220% 220%;animation:gshift 6s ease infinite,up .5s both;box-shadow:0 14px 40px #ff4d3d40}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(160px 120px at 85% 20%,#ffffff40,transparent 70%),repeating-linear-gradient(115deg,#ffffff0d 0 12px,transparent 12px 26px)}
.hero .ic{position:relative;z-index:1;width:56px;height:56px;border-radius:18px;background:#0000002e;display:grid;place-items:center;font-size:30px;flex:none;animation:zap 2.2s ease-in-out infinite}
@keyframes zap{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
.hero .tx{position:relative;z-index:1;flex:1}.hero small{color:#fff;opacity:.85;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.hero b{display:block;font:800 21px var(--H);color:#fff;margin:2px 0}.hero p{color:#fff;opacity:.9;font-size:12.5px}
.hero .ar{position:relative;z-index:1;font-size:22px;color:#fff;animation:nudge 1.4s infinite}@keyframes nudge{50%{transform:translateX(4px)}}
.jpb{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:14px;border-radius:22px;text-align:left;background:radial-gradient(140px 100px at 0 50%,#a855f744,transparent 70%),linear-gradient(180deg,#1a1424,#0e0b14);border:1px solid #a855f755;position:relative;overflow:hidden;animation:up .5s .08s both}
.jpb .mw{width:58px;height:58px;border-radius:50%;flex:none;background:conic-gradient(#ff8a1a 0 25%,#ff2e63 0 45%,#a855f7 0 70%,#38d9ff 0 85%,#ffc83d 0);animation:rot 6s linear infinite;box-shadow:0 0 24px #a855f766;position:relative}.jpb .mw::after{content:"";position:absolute;inset:20px;border-radius:50%;background:#0e0b14}
.jpb .g{flex:1}.jpb b{font:800 18px var(--H)}.jpb small{display:block}
.pulse{position:absolute;right:14px;top:12px}
.lob{padding:10px}.lob h2{margin:6px 6px 10px}
.rm{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--s1);border:1px solid var(--ln);margin-top:8px;animation:up .4s both;animation-delay:calc(var(--n,0)*40ms)}
.rm .gi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--ga) 50%,transparent),#0000 70%),var(--s2);border:1px solid color-mix(in srgb,var(--ga) 45%,transparent)}
.rm .g{flex:1;min-width:0}.rm .g b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.join{padding:9px 14px;border-radius:12px;background:var(--fire);color:#fff;font:800 12px var(--H);box-shadow:0 4px 16px #ff4d3d44}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{position:relative;overflow:hidden;text-align:left;padding:14px;border-radius:20px;background:linear-gradient(180deg,#15121c,#0d0b12);border:1px solid var(--ln);min-height:112px;animation:up .45s both;animation-delay:calc(var(--n,0)*60ms)}
.tile .ti{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--s3);margin-bottom:10px}.tile b{display:block;font-size:15px}.tile small{font-size:12px}
.tile::after{content:"";position:absolute;right:-24px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:var(--tg,#ff6a1a);opacity:.16;filter:blur(14px)}
.tile em{position:absolute;right:12px;top:12px;font:800 11px var(--H);font-style:normal;background:#2ee59d22;color:var(--ok);padding:3px 8px;border-radius:8px}
.hot{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}.hot::-webkit-scrollbar{display:none}
.hot .game{flex:none;width:132px}
/* ---------- карточки игр */
.game{--ac:var(--g1);position:relative;overflow:hidden;border-radius:20px;padding:16px 10px 14px;text-align:center;background:radial-gradient(120% 90% at 50% 0,color-mix(in srgb,var(--ac) 26%,transparent),transparent 62%),linear-gradient(180deg,#121019,#09080d);border:1px solid var(--ln);animation:up .45s both;animation-delay:calc(var(--n)*50ms);transition:transform .12s,border-color .2s,box-shadow .2s}
.game::before{content:"";position:absolute;left:-1px;top:-1px;width:44%;height:44%;border-radius:20px 0 0 0;border:2px solid var(--ac);border-right:0;border-bottom:0;-webkit-mask:linear-gradient(135deg,#000,transparent 70%);mask:linear-gradient(135deg,#000,transparent 70%);pointer-events:none}
.game:active{transform:scale(.96);border-color:var(--ac);box-shadow:0 0 26px color-mix(in srgb,var(--ac) 45%,transparent)}
.game.wide{grid-column:span 2;display:flex;align-items:center;gap:6px;text-align:left;padding:14px 18px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 28%,transparent),transparent 72%),linear-gradient(180deg,#121019,#09080d)}
.game.wide .art{margin:0 12px 0 0;flex:none}.game.wide .tx{flex:1}
.game b{display:block;font:700 13.5px var(--H);margin-top:10px;position:relative}.game.wide b{margin:0;font-size:18px}
.game small{position:relative;font-size:11.5px}
.game::after{content:"";position:absolute;inset:auto 14% 0 14%;height:2px;background:var(--ac);box-shadow:0 0 14px var(--ac);opacity:.75;border-radius:2px 2px 0 0}
.nw{position:absolute;top:9px;right:9px;background:var(--fire);color:#fff;border-radius:7px;padding:2px 7px;font:800 9.5px Manrope,system-ui;letter-spacing:.06em;z-index:2;box-shadow:0 2px 10px #ff4d3d66}
.art{position:relative;width:88px;height:88px;margin:0 auto}
.a-ch i{position:absolute;inset:0;display:grid;place-items:center;font:normal 66px/1 serif;color:#fff;filter:drop-shadow(0 4px 0 #0005);animation:hop 1.8s ease-in-out infinite}
.a-ch u{position:absolute;inset:8%;border:3px solid #fff8;border-radius:50%;animation:pg 1.8s ease-out infinite}
.a-ch b{position:absolute!important;left:24%;right:24%;bottom:2%;height:8%;margin:0!important;border-radius:50%;background:#0006;animation:sh 1.8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(8%) rotate(-6deg)}50%{transform:translateY(-12%) rotate(6deg)}}@keyframes pg{from{transform:scale(.6);opacity:1}to{transform:scale(1.15);opacity:0}}@keyframes sh{50%{transform:scaleX(.6);opacity:.5}}
.a-ck i{position:absolute;width:28px;height:28px;border-radius:50%}
.a-ck .x{left:6px;top:58px;background:radial-gradient(circle at 35% 30%,#fff,#d6d3d1);box-shadow:0 3px 0 #78716c;animation:jp 2.6s ease-in-out infinite}
.a-ck .y{left:32px;top:30px;background:radial-gradient(circle at 35% 30%,#fca5a5,#b91c1c);box-shadow:0 3px 0 #450a0a;animation:vn 2.6s infinite}
.a-ck .z{left:58px;top:4px;border:3px dashed #fff8}
@keyframes jp{0%,15%{transform:none}45%{transform:translate(26px,-66px) scale(1.25)}60%,90%{transform:translate(52px,-54px)}100%{transform:none}}@keyframes vn{0%,40%{transform:none;opacity:1}55%,90%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
.a-c4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#2563eb;padding:6px;border-radius:12px;box-shadow:0 4px 0 #1e3a8a}
.a-c4 i{aspect-ratio:1;border-radius:50%;background:#1e1b4b}.a-c4 .f{animation:fl4 3.2s infinite backwards;animation-delay:var(--w)}.a-c4 .r{background:#ef4444}.a-c4 .y{background:#fde047}
@keyframes fl4{0%{transform:translateY(-320%);opacity:0}10%{opacity:1}24%,75%{transform:none;opacity:1}92%,100%{opacity:0}}
.a-gk{background:#0f1220;border-radius:10px;border:1px solid #22d3ee55;box-shadow:0 0 22px #22d3ee33;overflow:hidden;background-image:repeating-linear-gradient(0deg,#3a426899 0 1px,transparent 1px 20%),repeating-linear-gradient(90deg,#3a426899 0 1px,transparent 1px 20%)}
.a-gk i{position:absolute;width:16px;height:16px;border-radius:50%;left:calc(var(--i)*16px + 4px);top:calc(var(--i)*16px + 4px);background:radial-gradient(circle at 35% 30%,#fff,#a1a1aa);animation:pp 3s infinite backwards;animation-delay:calc(var(--i)*.28s)}
