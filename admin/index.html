<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060b;--s1:#100e17;--s2:#17141f;--s3:#201b2b;--ln:#ffffff12;--ln2:#ffffff22;--mu:#958fa8;--tx:#f6f3fb;--f1:#ff7a18;--f2:#ff2e63;--f3:#a855f7;--ok:#2ee59d;--cy:#38d9ff;--gold:#ffc83d;--red:#ff4d6d;--fire:linear-gradient(135deg,#ffb11a,#ff6a1a 35%,#ff2e63 70%,#a855f7)}

@keyframes grow{from{width:0!important}}

.wrap{overflow-x:auto;background:linear-gradient(180deg,#121019,#0c0a12);border:1px solid var(--ln);border-radius:18px}

.pos{color:var(--ok)}.neg{color:var(--red)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mu)}
.av{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:var(--fire);color:#fff;font:800 14px Unbounded;flex:none}
.uc{display:flex;align-items:center;gap:10px}
.pg{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px;color:var(--mu)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--ln)}.sw:last-child{border:0}.sw small{color:var(--mu);display:block;font-weight:600}.sw input{width:120px}
.tg{width:48px;height:27px;border-radius:99px;background:var(--s3);border:1px solid var(--ln2);position:relative;flex:none;transition:.2s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--mu);transition:.25s cubic-bezier(.3,1.5,.5,1)}.tg.on{background:#ff6a1a44;border-color:var(--f1)}.tg.on::after{left:24px;background:#fff;box-shadow:0 0 12px var(--f1)}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:none;place-items:center;z-index:9;padding:16px;overflow:auto}.modal.on{display:grid}.modal .box{max-width:760px;max-height:92vh;overflow:auto;padding:24px}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}.row>*{flex:1}

.tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--ln);padding:4px;border-radius:12px;margin-bottom:14px;width:max-content;max-width:100%;overflow:auto}.tabs button{padding:7px 14px;border-radius:9px;color:var(--mu);font-weight:700;white-space:nowrap}.tabs button.on{background:var(--s3);color:#fff}
.empty{padding:28px;text-align:center;color:var(--mu)}
.spark{display:flex;align-items:flex-end;gap:3px;height:54px}.spark i{flex:1;background:linear-gradient(180deg,var(--f1),#ff2e6355);border-radius:3px 3px 0 0;min-height:2px;animation:sp .8s both;animation-delay:calc(var(--i)*25ms);transform-origin:bottom}@keyframes sp{from{transform:scaleY(0)}}
.feed div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:13px}.feed div:last-child{border:0}.feed b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.gm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.gm .it{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--s2);border:1px solid var(--ln)}.gm .it b{flex:1}.gm .it span{font-size:22px}

@media(max-width:900px){.grid2,.grid3,.two{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:sticky;z-index:5;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--ln);gap:2px}aside .logo,aside .sp,aside .live{display:none}aside button{white-space:nowrap;padding:8px 10px}aside button span{display:none}aside button.on span{display:inline}aside button.on::before{display:none}main{padding:16px 14px 60px}.top h1{font-size:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.c{padding:13px}.c .num{font-size:19px}.top .btn{padding:8px 12px;font-size:13px}}
</style></head><body>
<div id="lg" class="login"><div class="box"><div class="logo"><i>🔥</i><span>SPICH <b>GAME</b></span></div><p>Панель администратора. Введите пароль.</p><input id="pw" type="password" placeholder="ADMIN_PASSWORD" autofocus><button class="btn" id="go" style="width:100%;margin-top:12px;padding:13px">Войти</button><div class="err" id="er"></div></div></div>
<div id="ap" class="app" style="display:none">
<aside><div class="logo"><i>🔥</i><span>SPICH <b>GAME</b></span></div><nav id="nav" style="display:contents"></nav><div class="sp"></div><div class="live"><span class="dot"></span><span id="lv">онлайн</span></div><button id="out"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Выйти</span></button></aside>
<main id="m"></main></div>
<div class="modal" id="md"><div class="box" id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let TK=sessionStorage.adm||'',TAB='dash',PG=0,Q='',SORT='last',FIL='',KIND='',KUID='',GF='',WST='pending',timer,STATS=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=n=>(+n||0).toLocaleString('ru',{maximumFractionDigits:2});
const dt=t=>t?new Date(t*1000).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ago=t=>{if(!t)return'—';const s=Date.now()/1000-t;return s<60?'только что':s<3600?Math.floor(s/60)+' мин назад':s<86400?Math.floor(s/3600)+' ч назад':Math.floor(s/86400)+' дн назад'};
const toast=x=>{const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)};
const GN={arena:'🟢 Арена',bj:'🂡 21 (Очко)',pen:'⚽ Пенальти',durak:'🃏 Дурак',nardy:'🎲 Нарды',chess:'♟ Шахматы',checkers:'⛀ Шашки',connect4:'🔴 4 в ряд',gomoku:'⚫ Гомоку',reversi:'⚪ Реверси',ttt:'❌ Крестики-нолики',dice:'🎲 Кости',rps:'✊ Камень-ножницы',coin:'🪙 Монетка',hilo:'🂠 Больше/Меньше',jackpot:'🎡 Джекпот'};
const KN={deposit:['Пополнение','on'],withdraw:['Вывод','bad'],fee:['Комиссия','y'],ref:['Реферал','v'],bet:['Ставка',''],win:['Выигрыш','on'],refund:['Возврат','c'],admin:['Админ','v'],promo:['Промокод','y'],bonus:['Бонус','y'],giveaway:['Розыгрыш','y'],lbprize:['Приз рейтинга','y'],audit:['Аудит','']};
async function api(p,o){const r=await fetch('/api/admin/'+p,{...o,headers:{'Content-Type':'application/json','X-Admin':TK}});
 if(r.status===401&&p!=='login'){logout();throw new Error('auth')}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
async function dl(p,name){const r=await fetch('/api/admin/'+p,{headers:{'X-Admin':TK}});if(!r.ok)return toast('Ошибка');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function logout(){sessionStorage.adm=TK='';$('#ap').style.display='none';$('#lg').style.display='grid'}
async function login(){try{const j=await post('login',{password:$('#pw').value});TK=sessionStorage.adm=j.token;start()}catch(e){$('#er').textContent=e.message}}
$('#go').onclick=login;$('#pw').onkeydown=e=>e.key==='Enter'&&login();$('#out').onclick=logout;
const IC={dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',games:'<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11" r=".7"/><circle cx="18" cy="14" r=".7"/>',
wd:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',pay:'<path d="M3 7h18M3 12h18M3 17h12"/>',promo:'<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7z"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
bc:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',gw:'<path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.4 7.2 16.9l.9-5.4L4.2 7.7l5.4-.8z"/><path d="M7 22h10"/>',lbp:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M4 6h3M17 6h3"/>',sys:'<path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01"/>'};
const TABS=[['dash','Дашборд'],['users','Пользователи'],['games','Игры и комнаты'],['wd','Выводы'],['pay','Транзакции'],['promo','Промокоды и бонус-ссылки'],['gw','Розыгрыши'],['lbp','Призы рейтинга'],['set','Настройки'],['bc','Рассылка'],['sys','Система и журнал']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${l}</span>${k==='wd'&&STATS&&STATS.wd_pending?`<i class="bd">${STATS.wd_pending}</i>`:''}</button>`).join('');$$('#nav [data-t]').forEach(b=>b.onclick=()=>{PG=0;go(b.dataset.t)})}
function start(){$('#lg').style.display='none';$('#ap').style.display='grid';nav();go(TAB);setInterval(bg,15000);bg()}
async function bg(){try{STATS=await api('stats');$('#lv').textContent=STATS.online+' онлайн · '+STATS.tables+' столов';nav()}catch(e){}}
function go(t){TAB=t;clearInterval(timer);nav();$('#m').innerHTML='<div class="skel"></div>';({dash,users,games,wd,pay,promo,set,bc,sys,gw,lbp})[t]().catch(e=>{$('#m').innerHTML=`<div class="empty">Ошибка: ${esc(e.message)}</div>`});
 if(t==='dash'||t==='games')timer=setInterval(()=>TAB===t&&({dash,games})[t](true),6000)}
const hdr=(t,s,btns='')=>`<div class="top"><h1>${t}<small>${s||''}</small></h1>${btns}</div>`;
const card=(l,v,o={})=>`<div class="c ${o.hl?'hl':''}" style="--i:${o.i||0};--ac:${o.ac||'#ff7a18'}"><small>${l}</small><div class="num" data-cnt="${typeof v==='number'?v:''}">${typeof v==='number'?f2(v):v}</div>${o.sub?`<em>${o.sub}</em>`:''}</div>`;
function countUp(){$$('[data-cnt]').forEach(e=>{const v=parseFloat(e.dataset.cnt);if(!isFinite(v)||e.dataset.done)return;e.dataset.done=1;const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/900),ez=1-Math.pow(1-k,3);e.textContent=f2(v*ez);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function area(series,labels,colors,names){const W=640,H=200,P=28,n=labels.length,mx=Math.max(1,...series.flat());const x=i=>P+i*(W-P-8)/Math.max(1,n-1),y=v=>H-18-(v/mx)*(H-36);
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H+10}"><defs>${colors.map((c,i)=>`<linearGradient id="ga${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
 for(let g=0;g<=4;g++){const yy=18+g*(H-36)/4;s+=`<line x1="${P}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#ffffff10"/><text x="0" y="${yy+3}">${f2(mx*(1-g/4)|0)}</text>`}
 series.forEach((d,si)=>{const pts=d.map((v,i)=>[x(i),y(v)]);const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  s+=`<path d="${path} L${x(n-1)} ${H-18} L${x(0)} ${H-18}Z" fill="url(#ga${si})" style="animation:up .8s both"/><path d="${path}" fill="none" stroke="${colors[si]}" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="2000" stroke-dashoffset="2000"><animate attributeName="stroke-dashoffset" to="0" dur="1.3s" fill="freeze"/></path>`;
  pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${colors[si]}"><title>${labels[i]}: ${f2(d[i])}</title></circle>`)});
 labels.forEach((l,i)=>{if(n<10||i%2===0)s+=`<text x="${x(i)}" y="${H+6}" text-anchor="middle">${l}</text>`});
 return s+`</svg><div class="lg">${names.map((nm,i)=>`<span><i style="background:${colors[i]}"></i>${nm}</span>`).join('')}</div>`}

/* ---------------- призы рейтинга */
async function lbp(){const j=await api('lbprize'),c=j.cfg;const lt=s=>{s=Math.max(0,s|0);return Math.floor(s/86400)+' д '+Math.floor(s%86400/3600)+' ч'};
 $('#m').innerHTML=hdr('Призы рейтинга',`Текущий период: ${c.lb_period==='week'?'неделя (с понедельника)':'день'} · до конца ${lt(j.left)}`,`<button class="btn" id="lpay">💸 Выплатить сейчас</button>`)+
 `<div class="two"><div class="panel"><h2>⚙️ Настройки</h2><div class="sw"><div><b>Призы по местам ⭐</b><small>Через запятую: 1-е, 2-е, 3-е… (пусто — призов нет)</small></div><input id="lpr" value="${esc(c.lb_prizes.join(', '))}" style="width:200px"></div>
 <div class="sw"><div><b>Период</b><small>Итоги в конце периода</small></div><select id="lpe" style="width:160px"><option value="week" ${c.lb_period==='week'?'selected':''}>Неделя</option><option value="day" ${c.lb_period==='day'?'selected':''}>День</option></select></div>
 <div class="sw"><div><b>Критерий</b><small>По чему ранжировать</small></div><select id="lme" style="width:160px"><option value="profit" ${c.lb_metric==='profit'?'selected':''}>Выигрыш (профит)</option><option value="wins" ${c.lb_metric==='wins'?'selected':''}>Количество побед</option></select></div>
 <div class="sw"><div><b>Автовыплата</b><small>Автоматически наградить топ в конце периода</small></div><button class="tg ${c.lb_auto?'on':''}" id="lau"></button></div>
 <button class="btn" id="lsv" style="width:100%;margin-top:10px">💾 Сохранить</button></div>
 <div class="panel"><h2>🏆 Сейчас в топе</h2><div class="feed">${j.top.map((x,i)=>`<div><span>${['🥇','🥈','🥉'][i]||i+1}</span><b>${esc(x.name)}</b><span class="${c.lb_metric==='wins'||x.p>=0?'pos':'neg'}">${c.lb_metric==='wins'?x.w+' побед':f2(x.p)+'⭐'}</span>${c.lb_prizes[i]?`<span class="tag y">🎁 ${f2(c.lb_prizes[i])}⭐</span>`:''}</div>`).join('')||'<div class="empty">Пока пусто</div>'}</div></div></div>
 <h2>📜 История выплат</h2><div class="wrap"><table><thead><tr><th>Время</th><th>Период</th><th>Место</th><th>Игрок</th><th>Приз</th><th>Результат</th></tr></thead><tbody>${j.hist.map((h,i)=>`<tr style="--i:${i}"><td class="mono">${dt(h.ts)}</td><td>${esc(h.period)}</td><td>${['🥇','🥈','🥉'][h.place-1]||h.place}</td><td>${esc(h.name||h.uid)}</td><td class="pos">+${f2(h.amt)}⭐</td><td class="mono">${f2(h.val)}</td></tr>`).join('')}</tbody></table>${j.hist.length?'':'<div class="empty">Выплат ещё не было</div>'}</div>`;
 $('#lsv').onclick=async()=>{try{await post('settings',{lb_prizes:$('#lpr').value,lb_period:$('#lpe').value,lb_metric:$('#lme').value});toast('✅ Сохранено');lbp()}catch(e){toast(e.message)}};
 $('#lau').onclick=async()=>{await post('settings',{lb_auto:c.lb_auto?0:1});lbp()};
 $('#lpay').onclick=async()=>{if(!confirm('Выплатить призы текущему топу прямо сейчас?'))return;const r=await post('lbprize',{action:'pay'});toast(r.paid.length?'💸 Выплачено: '+r.paid.length:'Некому выплачивать');lbp()}}
if(TK)start();
</script></body></html>
